<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Planner</title>
    <script>
      (function () {
        var THEME_VARS = {
          forest: null,
          ocean: {
            '--bg': '#f2f5f8', '--surface': '#ffffff', '--ink': '#1c1e21', '--ink-soft': '#667080',
            '--rule': '#e1e7ed', '--route': '#0a84ff', '--route-soft': '#e3f0ff',
            '--ledger': '#c97a1e', '--ledger-soft': '#fbf0df', '--owe': '#e0483b', '--owe-soft': '#fceae8',
            '--hero': '#12283d', '--highlight': '#ecb34f',
          },
          plum: {
            '--bg': '#f6f2f8', '--surface': '#ffffff', '--ink': '#201c23', '--ink-soft': '#756b7c',
            '--rule': '#e6deea', '--route': '#af52de', '--route-soft': '#f3e5fb',
            '--ledger': '#c97a1e', '--ledger-soft': '#fbf0df', '--owe': '#e0483b', '--owe-soft': '#fceae8',
            '--hero': '#281a33', '--highlight': '#e9b457',
          },
          clay: {
            '--bg': '#f8f3ef', '--surface': '#ffffff', '--ink': '#241e1a', '--ink-soft': '#7a6d63',
            '--rule': '#ece0d6', '--route': '#c1440e', '--route-soft': '#fbe7dc',
            '--ledger': '#b4841e', '--ledger-soft': '#f8efdc', '--owe': '#c43d3d', '--owe-soft': '#f7e3e1',
            '--hero': '#35211a', '--highlight': '#e9b457',
          },
        };
        try {
          var id = localStorage.getItem('theme');
          var vars = id && THEME_VARS[id];
          if (vars) {
            var root = document.documentElement.style;
            for (var key in vars) root.setProperty(key, vars[key]);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
